# Quick start:
#   docker compose up --build
#   open http://localhost:8080
#
# Assumes Ollama is already running on the host machine (the normal case if
# you followed the non-Docker Quick Start in README.md) and reachable at
# host.docker.internal:11434 — Docker Desktop resolves that out of the box;
# the `extra_hosts` line below makes it resolve on Linux too. Point
# OLLAMA_HOST elsewhere (e.g. an OpenAI-compatible endpoint) via a .env file
# in this directory — compose reads it automatically the same way python-dotenv
# does for a non-Docker run. See .env.example for every variable and what it
# does; nothing here is Docker-specific except the two below it.
#
# Want Ollama itself containerized instead? `docker compose --profile with-ollama up`
# starts one alongside the app — see the `ollama` service at the bottom. It pulls
# no model by default; run `docker compose exec ollama ollama pull llama3.1:8b`
# once it's up, and point LLM_MODEL at whatever you pulled. With that profile,
# also set OLLAMA_HOST=http://ollama:11434 in your .env — the container-to-container
# service name, not host.docker.internal.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-90}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LANA_ALLOWED_ORIGINS: ${LANA_ALLOWED_ORIGINS:-http://localhost:8080}
      LANA_MAX_CONCURRENT_LLM: ${LANA_MAX_CONCURRENT_LLM:-2}
      LANA_MAX_UPLOAD_MB: ${LANA_MAX_UPLOAD_MB:-}
      LANA_MAX_SESSION_MB: ${LANA_MAX_SESSION_MB:-}
      LANA_MAX_SESSIONS: ${LANA_MAX_SESSIONS:-30}
      LANA_SESSION_TTL_SECONDS: ${LANA_SESSION_TTL_SECONDS:-3600}
      # Unlike a bare `uvicorn --reload` dev run, the container default is to
      # persist — a restarted container silently losing every session is a
      # worse surprise here than the disk cost of keeping them.
      LANA_PERSIST_SESSIONS: ${LANA_PERSIST_SESSIONS:-true}
      LANA_AUTH_TOKEN: ${LANA_AUTH_TOKEN:-}
      LANA_ACCOUNTS: ${LANA_ACCOUNTS:-false}
      LANA_ACCOUNTS_DB: ${LANA_ACCOUNTS_DB:-}
      # Trusted-header SSO — both must be set together, or the feature stays
      # off. See the `oauth2-proxy` service below (with-sso profile) and
      # SECURITY.md before setting these on an instance anyone else reaches.
      LANA_TRUSTED_HEADER_NAME: ${LANA_TRUSTED_HEADER_NAME:-}
      LANA_TRUSTED_HEADER_SECRET: ${LANA_TRUSTED_HEADER_SECRET:-}
      LANA_TRUSTED_HEADER_DEFAULT_ROLE: ${LANA_TRUSTED_HEADER_DEFAULT_ROLE:-member}
      # SMTP — password-reset email for local accounts. Leave SMTP_HOST unset
      # to leave the feature off; /auth/forgot-password still responds the
      # same either way, it just won't send anything.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      LANA_PUBLIC_URL: ${LANA_PUBLIC_URL:-}
    volumes:
      - lana_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # Bound to the loopback interface, not 0.0.0.0. `- "8000:8000"` — the
      # Compose default and what this used to say — publishes the port on
      # every interface the host has, so `docker compose up` on a laptop put
      # an unauthenticated upload-and-analyse API on the office wifi. That
      # directly contradicted SECURITY.md ("It binds to localhost") and it is
      # not a theoretical exposure: LANA_AUTH_TOKEN is empty by default, so
      # anyone who could route to the machine had full access.
      #
      # To reach LANA from another machine, set LANA_AUTH_TOKEN, put it behind
      # a TLS-terminating proxy, and change this to `${LANA_BIND:-127.0.0.1}:8000:8000`
      # with LANA_BIND=0.0.0.0 — deliberately, in one place, having read
      # SECURITY.md.
      - "127.0.0.1:8000:8000"  # direct API access — useful for curl/health checks

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No build args. The frontend image carries no secret and does not need
      # rebuilding when LANA_AUTH_TOKEN changes: the browser exchanges the
      # token for an HttpOnly cookie at runtime against the backend.
    restart: unless-stopped
    ports:
      # Loopback for the same reason as the backend above: the default stack
      # must not be reachable from the network, because the default stack has
      # no authentication.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Opt-in: `docker compose --profile with-ollama up`. Not part of the default
  # stack because pulling a model inside it is a multi-GB first run — most
  # people already have Ollama installed on the host per README.md instead.
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Ollama has no authentication of its own. Publishing it on every
      # interface hands anyone on the network a free inference endpoint and,
      # with some models, the ability to pull arbitrary ones onto this host.
      - "127.0.0.1:11434:11434"

  # Opt-in: `docker compose --profile with-sso up`. Puts oauth2-proxy in front
  # of `frontend` so a client's existing Google Workspace / Entra / Okta
  # identity provider gates sign-in, instead of LANA's own local accounts.
  # oauth2-proxy does the actual OAuth/OIDC exchange and, once a request is
  # authenticated, forwards it to `frontend` (which proxies /api/* to
  # `backend` per nginx.conf) carrying an identity header — LANA never talks
  # to the identity provider itself.
  #
  # This config covers the identity side only (OAUTH2_PROXY_PASS_USER_HEADERS
  # is on by default, which is what puts X-Forwarded-Email on the forwarded
  # request). It deliberately does NOT show how to add the required
  # X-Lana-Proxy-Secret header — that has to be injected by whatever sits at
  # your actual network edge (this proxy's own alpha-config
  # `injectRequestHeaders`, or an nginx/Caddy layer in front of it), and it
  # MUST overwrite rather than append to any X-Forwarded-Email or
  # X-Lana-Proxy-Secret a client already sent, or a request could smuggle a
  # second value past it. See "Trusted-header SSO" in SECURITY.md — read it
  # before setting LANA_TRUSTED_HEADER_SECRET on an instance anyone else can
  # reach, this is the one part of this feature that is easy to get wrong.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    profiles: ["with-sso"]
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-oidc}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?set your IdP's issuer URL}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set the OAuth app client id}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set the OAuth app client secret}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?generate one with the python -c 'import secrets;print(secrets.token_urlsafe(32))' command}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_UPSTREAMS: http://frontend:80/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
    ports:
      - "${LANA_BIND:-127.0.0.1}:4180:4180"
    depends_on:
      frontend:
        condition: service_started

volumes:
  lana_data:
  ollama_data:
