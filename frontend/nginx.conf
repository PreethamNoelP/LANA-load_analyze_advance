# Serves the built SPA and reverse-proxies /api/* to the backend container,
# stripping the /api prefix — the same rewrite frontend/vite.config.js's dev
# proxy performs, so the app's own src/api.js (which always calls `/api/...`)
# needs no production-specific branch.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The backend enforces its own (host-derived) upload size limit and
    # returns an actionable 413 when a file exceeds it — nginx should not
    # duplicate that cap with a stricter, silent one of its own.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /query/stream is server-sent events — buffering here would hold the
        # whole answer until it finished, defeating the point of streaming it.
        proxy_buffering off;
        proxy_set_header Connection "";

        # Analysis endpoints legitimately run close to two minutes on a large
        # dataset (see frontend/src/api.js's own ANALYSIS_TIMEOUT_MS); an
        # upload can run to five. A shorter proxy timeout would turn a slow
        # answer into a broken connection before the backend's own deadline
        # ever has a chance to fire.
        proxy_connect_timeout 10s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
