name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented floor; 3.13 catches deprecations before a
        # contributor on a newer interpreter hits them.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Import sanity check
        run: python -c "import backend.main"
      - name: Lint
        run: ruff check .
      # docs/provenance.md states it mirrors VERIFIED_CLAIM_TYPES and
      # KNOWN_BLIND_SPOTS in app/llm/validation.py. A test asserts the text
      # matches; this asserts the doc is *regenerable*, so the two cannot drift
      # through a hand-edit that happens to satisfy the substring check.
      - name: Check docs mirror the validator
        run: python -m scripts.regen_provenance --check
      - name: Run tests
        run: pytest tests/ -q --cov=app --cov=backend --cov-report=term-missing
      # Recomputes the validator's precision and recall against the adversarial
      # suite. No model, fully deterministic, about a second — so the headline
      # trust numbers are measured on every push rather than quoted from a
      # README that was true once.
      - name: Validator precision/recall
        run: python -m eval.validator_bench
      # A concurrency smoke test: 8 clients against every session endpoint,
      # exiting non-zero on any 5xx. Catches a lock-ordering or shared-state
      # regression that a serial test suite cannot see, which is exactly the
      # class of bug the session store's caches could reintroduce.
      - name: Concurrency smoke test
        run: python -m eval.load_test --concurrency 8 --requests 5 --rows 5000

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Builds both images on every push/PR so a Dockerfile break is caught here,
  # not by the next person trying `docker compose up`. Build-only: this repo
  # does not publish images anywhere yet.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t lana-backend .
      - name: Build frontend image
        run: docker build -t lana-frontend ./frontend

  # Dependency advisories are reported, not enforced: a new CVE in a transitive
  # dependency should show up on the next run, but it should not turn every
  # unrelated pull request red until someone can act on it.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit shipped frontend dependencies
        working-directory: frontend
        # --omit=dev deliberately: the build toolchain is not shipped to users,
        # and failing on dev-only advisories trains people to ignore this job.
        run: npm ci && npm audit --omit=dev
